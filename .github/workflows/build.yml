name: Build Alooy TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AlooyTV_AndroidTV_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o AlooyTV_AndroidTV_Project.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AlooyTV_AndroidTV_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlooyTV-APK
          path: AlooyTV_AndroidTV_Project/app/build/outputs/apk/debug/app-debug.apk
          
